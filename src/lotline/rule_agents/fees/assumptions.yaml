# Fees rule agent: assumptions the helpers use that are not in config/params/ (yet).
# Each has a source. Proposed to move into config/params/fees.yaml once Ben approves (see DESIGN.md).
# Prototype sizes and hard cost are NOT here: they are read from config/params/proforma.yaml.

bedrooms_per_unit:
  value: {SFD: 3, U2: 2, U3_4: 2, ADU: 1, OTHER: 3}
  source: "Judgment for per-bedroom fees (Brunswick County, NC water/sewer): a 3-bedroom house and 2-bedroom plex units, as the 2026-11-09 plex-utility pass assumed (logbook.d/2026-11-09-ws-fees-plex-utility.md); a 1-bedroom ADU"
  notes: "Used only for basis_kind per_bedroom. Every row priced this way says so in notes."

units_per_building:
  value: {SFD: 1, U2: 2, U3_4: 4, ADU: 1, OTHER: 1}
  source: "Building types in schemas.py; U3_4 is priced as a fourplex, as scripts/dev/ordinance_records.py does (the model's missing-middle prototype)"

agree_tolerance:
  value: {relative: 0.005, absolute_usd: 1.0}
  source: "Choice: coders agree when per-unit amounts differ by at most 0.5% or $1 (rounding in schedules)"

budgets_per_place:
  value: {requests: 12, searches: 6, documents_read_in_full: 3}
  source: "Choice, from the 2026-11-09 coverage passes (most places needed 2-4 documents); keeps runs token-lean"

min_seconds_between_requests_per_host:
  value: 2.0
  source: "Choice; lotline.io.http keeps 1.0 s for census.gov after the 2026-10-19 block (R6)"
