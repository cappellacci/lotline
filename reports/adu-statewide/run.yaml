method: 'D-039''s fit, scored on state totals. Leave one state out: refit on the other three states and predict
  every place of the held-out state, drawing θ once per draw and a place effect and blank-rule combination per
  place, then sum. Verdict: useful if the observed total is inside P10-P90 and within a factor of 2 of P50;
  inside only; or missed.'
