reading: 'For Ben to confirm. One of four state totals is useful (NC''s six towns); OH and NC with Raleigh and
  Durham are inside only; MN is over-predicted (306 vs P50 1,115) and TX under-predicted (2,785 vs 319). θ
  moves from 0.78 (without TX) to 4.67 (without MN). The diagnosis after this run traced most of it to counts:
  Austin''s co-built ADUs and Met Council''s under-reporting (D-041). θ by fit is in the analysis plan, not a CSV.'
