# Minnesota. Primary state (BUILD_PLAN §6). WS-CORE owns structure + holdouts; WS-MN fills in sources.
state: MN
name: Minnesota
fips: "27"
bps_region: Midwest Region
township_permits: true  # townships issue building permits (BPS rows per township)
# USPS 3-digit ZIP prefixes (inclusive ranges); source: USPS ZIP Code prefix assignments
zip3_ranges: [[550, 567]]
holdouts:
  - test_id: V5-MN-STPAUL
    place: St. Paul
    geoid: "2758000"
    outcome_from: 2024-01-01
    outcome_until: 2026-12-31
    reason: V5 blind forward test of the St. Paul 2023 reform (validation plan §3)
# Last date usable for fitting, by GEOID (validation plan §2). St. Paul: data through 2023 only (V5 blind test).
train_until:
  "2758000": 2023-12-31
# One parcels source per jurisdiction where MN parcel sources overlap (build/eligible.single_source, #147).
# Minneapolis: the city assessor tables carry units and building use (PENDING BEN, decision 1); everyone else:
# Met Council regional parcels (St. Paul from the 2021-2023 rolls only, V5; PENDING BEN, decision 2).
# ramsey_parcels (current roll, frontage) is not a denominator source.
parcel_sources:
  "2743000": mpls_assessor_parcels
  "*": metc_parcels
sources:
  - name: metc_permits
    url: https://arcgis.metc.state.mn.us/data1/rest/services/structure/Other_Structure_Public/FeatureServer/0
    license: Public domain (Minnesota Government Data Practices Act, Minn. Stat. ch. 13)
    access: arcgis
    cadence: annual (prior year posted mid-year)
    notes: >-
      Met Council Residential Permits, 7-county metro, permit-year ledger 2009 on. Listed on the Geospatial
      Commons as us-mn-state-metc-econ-residential-building-permts (file GDB also offered; not used).
  - name: mpls_permits
    url: https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services/CCS_Permits/FeatureServer/0
    license: CC0 1.0 (City of Minneapolis open data waiver)
    access: arcgis
    cadence: rolling window from Dec 2016, updated daily; every fetch is a dated snapshot
    notes: >-
      Minneapolis Construction Code Services permits. Building permits only (Res, Commercial, Wrecking).
      Applicant and owner names and applicant address are never requested. No ADU flag: ADUs are inferred
      from the scope of work (type_confidence=inferred).
  - name: stpaul_permits
    url: https://services1.arcgis.com/9meaaHE3uiba0zr8/arcgis/rest/services/Building_Permits_/FeatureServer/0
    license: Public domain (City of Saint Paul item license; provided 'as is')
    access: arcgis
    cadence: >-
      rolling 10-year window, but frozen: layer data last edited 2025-07-01 (layer.json editingInfo, checked
      2026-10-19); every fetch is a dated snapshot
    notes: >-
      St. Paul DSI building permits from 2015-06-30. No unit counts, no ADU flag: secondary to Met Council for
      St. Paul outcomes. V5 holdout: rows from 2024 on are filtered before any processing. Street address and
      contractor name/address are never requested.
  - name: metc_parcels
    url: https://arcgis.metc.state.mn.us/data1/rest/services/parcels
    license: Public domain (Minnesota Government Data Practices Act); MetroGIS counties share without fee or license
    access: arcgis
    cadence: >-
      quarterly current roll (Parcel_Points_Aggregate) plus archived rolls Parcel_Points_2021..2025; county
      export dates (EXP_DATE): 2021-12-28..2022-01-12, 2022-12-29..2023-01-18, 2023-10-01..2024-01-08,
      2024-12-30..2025-01-15, 2025-06-27..2025-07-23 (mid-year), current 2026-06-27..2026-07-13
    notes: >-
      7-county parcel points. vintage = service-name year, vintage_date = county's latest EXP_DATE (Ben,
      2026-10-19). St. Paul only from the 2021-2023 rolls (V5 snapshot rule). Rolls 2002-2020 are token-locked
      (ds1/GISParcels, checked 2026-10-19). Hennepin NUM_UNITS/DWELL_TYPE blank. Owner, taxpayer and situs
      address fields never requested.
  - name: mpls_assessor_parcels
    url: https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services
    license: CC0 1.0 (City of Minneapolis open data waiver)
    access: arcgis
    cadence: one table per assessment year (Assessors_Parcel_Data_2017..2022, Assessing_Department_Parcel_Data_2023..2026)
    notes: >-
      Minneapolis assessor parcels (units, building use incl. ADU houses, year built, zoning, values), proposed in
      place of hennepin_parcels: gis.hennepin.us robots.txt disallows all paths, and Hennepin's Hub download is a
      whole-file export with owner/taxpayer names and no unit count. Owner, taxpayer and address fields never
      requested.
