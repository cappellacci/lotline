# with Met Council parcels; a place in both a metro and an outstate county takes the source holding most of
# its parcels on the current rolls: Hanover, Northfield and Rockford take MnGeo (their metro part is left
# out); Dayton, East Bethel, St. Francis, Linwood and Watertown townships take Met Council.
# ramsey_parcels (current roll, frontage) is not a denominator source.
