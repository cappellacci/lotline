# North Carolina. Second full in-state validation (BUILD_PLAN §6).
state: NC
name: North Carolina
fips: "37"
bps_region: South Region
township_permits: false  # townships issue building permits (BPS rows per township)
# USPS 3-digit ZIP prefixes (inclusive ranges); source: USPS ZIP Code prefix assignments
zip3_ranges: [[270, 289]]
holdouts:
  - test_id: V5-NC-CHARLOTTE
    place: Charlotte
    geoid: "3712000"
    outcome_from: 2023-06-01
    outcome_until: 2099-12-31
    reason: V5 blind forward test of the Charlotte UDO (duplex/triplex on N1 lots, effective 2023-06-01)
    reporting_geoids: ["37119"]
    reporting_reason: >-
      BPS has no Charlotte place row: Charlotte-Mecklenburg Code Enforcement reports Charlotte's permits (and
      the Mecklenburg towns') under Mecklenburg County (37119), so 37119 rows carry Charlotte's outcomes and
      are held out over the same window (found 2026-10-19, #123).
# One parcels source per jurisdiction (build/eligible.single_source), so no place switches rolls between
# years. Wake places and the Wake remainder: the county's pre-revaluation December 2023 roll (V2 baseline;
# its Design Style separates townhouses, which NC OneMap codes as detached). Charlotte: the pre-UDO
# translation layer (zoning only, dated 2023-05-31). Everyone else: NC OneMap. Places mostly outside Wake
# (Durham, Angier, Clayton) are not in the Wake roll (config/crosswalks/nc_land_use_wake_jurisdictions.csv).
parcel_sources:
  "3755000": wake_realestate  # Raleigh
  "3710740": wake_realestate  # Cary
  "3701520": wake_realestate  # Apex
  "3770540": wake_realestate  # Wake Forest
  "3725300": wake_realestate  # Fuquay-Varina
  "3732260": wake_realestate  # Holly Springs
  "3725480": wake_realestate  # Garner
  "3744520": wake_realestate  # Morrisville
  "3736080": wake_realestate  # Knightdale
  "3771860": wake_realestate  # Wendell
  "3776220": wake_realestate  # Zebulon
  "3757640": wake_realestate  # Rolesville
  "37183": wake_realestate  # Wake County outside city limits
  "3712000": clt_udo_translation  # Charlotte
  "*": onemap_parcels
sources:
  - name: raleigh_permits
    url: https://services.arcgis.com/v400IkDOw1ad7Yad/arcgis/rest/services/Building_Permits/FeatureServer/0
    license: Open Raleigh Data Policy (public open data, no warranty)
    access: arcgis
    cadence: daily
    notes: >-
      Adapter src/lotline/adapters/states/nc/raleigh_permits.py. 184,524 records 2000-present on 2026-10-14
      (data last edited 2026-10-10). Units repaired from censuslandusecode where housingunitstotal is empty
      (from 2024) or implausible; see the adapter's PROVENANCE.
  - name: durham_permits
    url: https://services2.arcgis.com/G5vR3cOjh6g2Ed8E/arcgis/rest/services/Inspections/FeatureServer/12
    license: City of Durham open data (Privacy Notice and Terms of Service on the Hub item)
    access: arcgis
    cadence: daily
    notes: >-
      FRESH (Ben's decision 2026-10-14), citing this hosted layer: 93,180 records, ISSUE_DATE 2007-10-22 to
      2026-10-09, layer data last edited 2026-10-14; 2023 5,631 permits, 2024 5,179, 2025 5,833. Adapter
      src/lotline/adapters/states/nc/durham_permits.py (77,479 permits kept on 2026-10-14 after dropping
      Void/Disapproved/Received). The older MapServer (webgis2.durhamnc.gov/server/rest/services/
      PublicServices/Inspections/MapServer/12) times out from this network, and the Hub items "All Building
      Permits" (f352381d9b3c4949b4aead66f6e62889) and "(table only)" show 2024-11-13 as item metadata date,
      which is why the source first looked stale. City-County Inspections serves both the city and the
      county and the layer has no jurisdiction field: the adapter places each permit by point-in-polygon
      against the City of Durham corporate limits (CoD_Boundary FeatureServer/1, current limits), with an
      NC PIN-prefix fallback for permits without a point; see the adapter's PROVENANCE.
  - name: greensboro_permits
    url: https://gis.greensboro-nc.gov/arcgis/rest/services/OpenGateCity/OpenData_HRES_DS/MapServer/2
    license: City of Greensboro open data (public records; no license stated)
    access: arcgis
    cadence: daily
    notes: >-
      Adapter src/lotline/adapters/states/nc/greensboro_permits.py. "Engineering & Inspections - Building
      Permits" table (no geometry, no parcel number): 125,092 permits issued 1990-07-30 to 2026-10-20 on
      2026-10-21. gis.greensboro-nc.gov/robots.txt does not exist (404). Units from OccupancyDesc and
      NumUnits; ADUs from the description parser. Missing from the catalog until 2026-10-21 (it listed only
      the current-year ArcGIS experience).
  - name: durham_active_permits
    url: https://services2.arcgis.com/G5vR3cOjh6g2Ed8E/arcgis/rest/services/Permits/FeatureServer/13
    license: City of Durham open data (Privacy Notice and Terms of Service on the Hub item)
    access: arcgis
    cadence: daily
    notes: >-
      "Active Building Permits": a rolling window by status, not by date. On 2026-10-14 it held 6,910 open
      permits (6,794 issued, 116 received; IDs from 19xxxxxx to 26xxxxxx), no date fields, edited daily. Closed
      permits drop out, so it is not needed while the hosted All Building Permits layer is fresh. Not loaded.
  - name: onemap_parcels
    url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/MapServer/0
    license: NC OneMap public data; county-sourced, provided as is (no open license stated)
    access: arcgis
    cadence: rolling (each county re-sent on its own schedule; dates in NC1Map_Parcels_Transform_Dates)
    notes: >-
      Adapter src/lotline/adapters/states/nc/onemap_parcels.py (parcel points, 5,000 per page). Per-county
      vintage from https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels_Transform_Dates/FeatureServer/0
      (2026-10-19: from Mecklenburg 2026-01-07 to Cabarrus 2026-05-29). Ten largest counties (2020 Census).
      Land-use codes are county-native: crosswalks in config/crosswalks/nc_land_use_<county>.csv; field order,
      vacant rule and data tier per county in nc_land_use_counties.csv.
      Current roll only, so every Charlotte (3712000) and unincorporated Mecklenburg (37119, D-012) parcel is
      held out by the snapshot rule; the Mecklenburg towns stay.
  - name: clt_udo_translation
    url: https://services.arcgis.com/9Nl857LBlQVyzq54/arcgis/rest/services/Unified_Development_Ordinance_Zoning_Translation/FeatureServer/193
    license: City of Charlotte open data (public records; no license stated)
    access: arcgis
    cadence: one-off (frozen translation layer; data last edited 2023-05-31)
    notes: >-
      Adapter src/lotline/adapters/states/nc/clt_udo_translation.py. Parcels in Charlotte's zoning jurisdiction
      with pre-UDO and UDO districts (324,180 features). Data last edited 2023-05-31, before the V5 window
      (2023-06-01); the adapter checks editingInfo.dataLastEditDate before downloading and stops if it moves.
      No land use or year built: see reports/nc/charlotte_pre_udo_parcels.md.
  - name: meck_permits
    url: https://meckgis.mecklenburgcountync.gov/server/rest/services/BuildingPermits/FeatureServer/0
    license: Mecklenburg County GIS public data (accuracy disclaimer; no license stated)
    access: arcgis
    cadence: rolling (permits since 1990; ArcGIS item fc9d171ecd4d44a58c7dad840cd58aa2)
    notes: >-
      Adapter src/lotline/adapters/states/nc/meck_permits.py. Holdout-first: a server-side filter leaves out
      Charlotte and unincorporated-county permits from 2023-06-01 (V5, D-012), and holdout.apply drops the rest
      before anything is written. On 2026-10-20 the server answered this network with a Cloudflare browser
      challenge (HTTP 403). On 2026-10-21 Ben downloaded the same layer by hand from the county's Open Data
      Viewer (https://maps.mecklenburgcountync.gov/opendata-viewer, "Building Permits - Winchester", legacy
      permits; GeoPackage dated 2026-10-12) and registered it; the adapter reads that file with the same
      holdout-first filter in its query. The taxjuris spellings are verified on it (unincorporated permits are
      MECKLENBURG).
  - name: wake_realestate
    url: https://www.wake.gov/departments-government/tax-administration/data-files-statistics-and-reports/real-estate-property-data-files
    license: Wake County public records (no license stated)
    access: manual
    cadence: one-off (final roll before the 2024 revaluation; the current file is refreshed daily)
    notes: >-
      Adapter src/lotline/adapters/states/nc/wake_realestate.py. services.wake.gov/robots.txt disallows all
      automated access, so Ben downloads Real_Est_Data_Final_Dec2023.xlsx (and, for the record,
      Qualified_Sales_Past_24Months.xlsx) in a browser from the page above and registers them with
      `lotline manifest register --source wake_realestate`. 443,785 cards for 427,566 parcels; columns match
      the county Record Layout (2019-01-14). V2 baseline roll for Raleigh. Only non-personal columns are read.
      The qualified-sales file is registered but not read (no canonical sales table yet).
