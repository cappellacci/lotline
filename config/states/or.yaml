# Oregon. Transfer test first, then pooled into calibration (Ben, 2026-11-04; docs/build/or-assessment.md
# option C). Lean scope: Portland Metro (RLIS taxlots), Portland and Bend permits, state-law rule rows, BPS.
# Workstream brief: docs/build/workstreams/WS-OR.md.
state: OR
name: Oregon
fips: "41"
bps_region: West Region
township_permits: false  # no townships; counties permit unincorporated land (county-remainder rows)
# D-068 (Ben, 2026-11-09): SB 1051 / HB 2001 ADU rows are generated for every city of 2,500+ people and every
# covered county (scripts/dev/or_state_reform_rows.py), so a place with no ADU row is outside the law. Those
# places (44 small cities, 6 rural county remainders) take the prior of states without a coded state ADU law.
adu_state_law_rows_complete: true
# USPS 3-digit ZIP prefixes (inclusive ranges); source: USPS ZIP Code prefix assignments
zip3_ranges: [[970, 979]]
# V9 (validation plan): every Oregon outcome from 2018 on stays hidden until the frozen four-state prediction
# of Oregon is on main. Written before any Oregon outcome was fetched: on 2026-11-04 the data directory held
# no West Region BPS file and no Oregon permits or parcels. 2018 is the year SB 1051 (ADUs) took effect;
# HB 2001 (middle housing, 2021-22) falls inside the same window. As a statewide holdout it also hides every
# Oregon parcel roll taken from 2018 on (rolls are snapshots), so the frozen prediction uses pre-2018 rolls
# or the ACS fallback.
holdouts:
  - test_id: V9-OR-TRANSFER
    place: Oregon (statewide)
    geoid: "41"
    outcome_from: 2018-01-01
    outcome_until: 2099-12-31
    reason: >-
      V9 transfer test: predict Oregon's ADU and middle-housing permits 2018 on from the MN/NC/OH/TX
      calibration, freeze, then unblind and pool Oregon into the calibration (validation plan V9)
    # Released by Ben on 2026-11-05 after scoring: frozen in #298 (results/frozen/V9-OR-TRANSFER.json),
    # scored in #299 and #301 (reports/v9-oregon/, D-051 and D-052 results in docs/analysis_plan.md).
    released_on: 2026-11-05
    released_note: >-
      Frozen and scored (#298, #299, #301). Oregon's full data is now built and pooled into the calibration
      for the five-state comparison (Ben, 2026-11-05; docs/build/workstreams/WS-OR.md step 8)
sources:  # added by WS-OR with each adapter
  - name: portland_permits
    url: https://opendata.arcgis.com/api/v3/datasets/02d99db039e0428da88262bff513056a_89/downloads/data?format=csv&spatialRefId=4326
    license: No license stated (City of Portland open data, Bureau of Planning and Sustainability)
    access: download
    cadence: continual (Hub extract dated by Esri; 2026-09-12 on 2026-11-05)
    notes: >-
      Adapter src/lotline/adapters/states/or/portland_permits.py. Residential Building Permits (PortlandMaps
      COP_OpenData_PlanningDevelopment/MapServer/89: every permit creating new units since 1995), read from the
      ArcGIS Hub CSV extract because the PortlandMaps server refuses connections from our network. IS_ADU is the
      city's ADU flag; a new house + ADU on one permit is split into two rows for D-041's co-built rule.
  - name: bend_permits
    url: https://services5.arcgis.com/JisFYcK2mIVg9ueP/arcgis/rest/services/Permitting_Table/FeatureServer/0
    license: City of Bend GIS terms (as is, no warranty; no reuse restriction stated)
    access: arcgis
    cadence: weekly
    notes: >-
      Adapter src/lotline/adapters/states/or/bend_permits.py. Building applications NC, AD, RE, MA and DE only.
      ADU = building use ADU (from 2013); HB2001ADU marks HB 2001 pathway permits (duplexes included) and is
      kept as the raw reform flag, not the ADU flag.
  - name: rlis_parcels
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Taxlots_(Public)/FeatureServer/3
    license: >-
      RLIS Open Database End User License Agreement (Metro, Feb 2023): attribution only, compatible with
      CC BY 4.0 and ODC-By; https://rlisdiscovery.oregonmetro.gov/pages/open-database-license
    access: arcgis
    cadence: quarterly (the November release carries the certified tax roll)
    notes: >-
      Adapter src/lotline/adapters/states/or/rlis_parcels.py. Multnomah, Washington and Clackamas tax lots
      (current roll only: RLIS publishes no dated archives). Land use from the DOR property class
      (config/crosswalks/or_rlis_land_use.csv); jurisdiction from Metro's JURIS_CITY; zoning_raw from Metro's
      regional Zoning layer (FeatureServer/1) by label point (sf_only_zoned left null). Every other Oregon
      jurisdiction stays on the ACS fallback (D-017).
  - name: mwvcog_permits
    url: https://services2.arcgis.com/89BLPQl3PdPQE7iy/arcgis/rest/services/Permits_online/FeatureServer/0
    license: No license stated (Mid-Willamette Valley Council of Governments public ArcGIS Online layer)
    access: arcgis
    cadence: quarterly (rows carry year and quarter)
    notes: >-
      Adapter src/lotline/adapters/states/or/mwvcog_permits.py. Residential building permits since 1998 for
      Salem, Keizer, Turner and unincorporated Marion and Polk; Type ADU is the COG's ADU category (from
      2018). Jurisdiction from the permit's City, else the self-permitting office. The City of Salem's own
      permit layer bars copying and covers one rolling year, so it is not used.
  - name: medford_permits
    url: https://maps.medfordmaps.org/arcgis/rest/services/TRAKiTExport/TRAKiTPermits_service/FeatureServer/1
    license: No license stated (City of Medford public ArcGIS service; open data hub no-warranty disclaimer)
    access: arcgis
    cadence: continual (TRAKiT export, permits from 2020)
    notes: >-
      Adapter src/lotline/adapters/states/or/medford_permits.py. ADU = Medford's ADU permit subtypes on new
      construction; a house + ADU permit is split into two rows for D-041's co-built rule.
