# V5 Charlotte blind test: what the lots that became N1 on 2023-06-01 held before that day. No public
# Charlotte roll from before the window has land use (reports/nc/charlotte_pre_udo_parcels.md), so these
# shares are a prior from the six other Mecklenburg towns on the current NC OneMap roll (option (b), approved
# by Ben 2026-10-21); replace them with counts if Mecklenburg County sends an archived roll (option (a)).
# Reproduced by lotline.adapters.states.nc.clt_v5.town_prior (method in its docstring).

n1_sf_share:
  value: 0.732
  low: 0.515
  high: 0.812
  unit: share of Charlotte N1 lots holding a single-family detached house before 2023-06-01
  source: "Lotline calculation (clt_v5.town_prior, 2026-10-21) on NC OneMap parcels for Cornelius, Davidson, Huntersville, Matthews, Mint Hill and Pineville (Mecklenburg transform date 2026-01-07); value = pooled share, range = lowest (Pineville) and highest (Matthews) town"
  notes: "Parcels an N1 district would not hold are left out (commercial, industrial, apartments, condominium units, mixed use, unknown); homes built in 2023 or later count as vacant lots. Assumes Charlotte's N1 lots resemble the towns' low-density parcels: Charlotte's older inner neighbourhoods likely have fewer vacant lots, which the range does not capture."

n1_vacant_share:
  value: 0.119
  low: 0.067
  high: 0.149
  unit: share of Charlotte N1 lots that were vacant residential lots before 2023-06-01
  source: "Same calculation as n1_sf_share; value = pooled share, range = lowest (Cornelius) and highest (Mint Hill) town"
  notes: "Vacant lots count toward missing-middle eligibility under rule 1.1 (D-014). The towns grew fast after 2010, so their vacant share may overstate Charlotte's."
