# Gross-to-net and statewide aggregation (model/aggregate.py, protocol §5.10). Every value has a source.
# Where a source gives only a range, the central value is its midpoint and the notes say so.

adu_net_new_share:
  value: 0.65
  low: 0.45
  high: 0.80
  unit: share of permitted ADUs
  source: "Statistical protocol §5.10; methods review §3b; E039 (CCI 2021: ~48% housing), E051 (UCLA 2020: 76%), E052 (Oregon DEQ 2014: 80%); low end 0.45 below E039 (judging finding MS-09, D-019)"
  notes: "Share of permitted ADUs that add a home (long-term residence), not an office, guest room or short-term rental. Central value kept at 0.65; the low end was 0.50, above E039's 48%."

adu_formalization_share:
  value: 0.10
  low: 0.0
  high: 0.30
  unit: share of ADU permits that legalize an existing unpermitted unit
  source: "Judgment, from E049 (San Jose 2016-20: ~78% of detached ADU construction unpermitted, 3-4 informal per formal) and E050 (Freddie Mac: 34-80% of homes in three LA neighborhoods had unpermitted units); statistical protocol §5.10 asks for a formalization adjustment (MS-09)"
  notes: "A legalized unit is a permit but not a new home. No study measures the share of post-reform permits that are legalizations; the high end reflects West Coast informality, the low end markets with little informal stock."

baseline_adu_share_of_one_unit:
  value: 0.033
  low: 0.0047
  high: 0.0765
  unit: ADU permits / (ADU + detached single-family permits)
  source: "scripts/dev/adu_baseline_share.py: Met Council residential permits and Austin permits, 2019-2022 (MS-10): Twin Cities metro 127 of 26,874 = 0.0047; Austin 1,371 of 17,928 = 0.0765; pooled 0.033"
  notes: "Census BPS counts a detached ADU as a 1-unit permit, so the baseline single-family forecast already holds some ADUs. Used to split the baseline into houses and ADUs where a place's own permits don't flag ADUs. The two sources differ 16-fold: Austin has allowed ADUs for years in a high-rent market; most metro suburbs restrict them. The range is that spread."

displacement_share:
  value: 0.25
  low: 0.0
  high: 0.50
  unit: share of local gain
  source: "Statistical protocol §6 (decision table: '0-50% range parameter'); methods review §5 (pitfall 1, displacement and spillovers); two-prong design; E001 (Auckland bounds), E004 (Lower Hutt)"
  notes: "Share of a place's gain that is pulled in from neighbors rather than new statewide. Shown as 'in this place' vs 'net statewide'. Central value is the midpoint of the range until neighbor-place data say otherwise."

completion_factor_single_family:
  value: 0.97
  low: 0.95
  high: 1.0
  unit: completions per permitted unit
  source: "Census New Residential Construction via FRED, long-run completions per permitted unit, recomputed by scripts/dev/completion_factors.py (lotline.model.completion): PERMIT1NSA vs COMPU1UNSA, 1-year lag; 1.04 (1990-2019), 1.02 (2000-2019), 1.03 (2010-2022)"
  notes: "Also used for ADUs. Measured ratios exceed 1 because Census completions include areas that issue no permits (2-5% of starts) and townhouses permitted as 2+ units; the rate for permitted units is just under 1. Central 0.97 allows for that; range to 1.0."

completion_factor_multifamily:
  value: 0.80
  low: 0.74
  high: 0.88
  unit: completions per permitted unit
  source: "Census New Residential Construction via FRED, long-run completions per permitted unit, recomputed by scripts/dev/completion_factors.py (lotline.model.completion): PERMIT24NSA+PERMIT5NSA vs COMPU24UNSA+COMPU5MUNSA, 2-year lag; 0.77 (1990-2019), 0.74 (2000-2019), 0.79 (2010-2022)"
  notes: "Buildings with 2+ units, used for missing middle. Measured ratios are a lower bound: townhouse rows permitted as 2+ units are completed as single-family. Central 0.80 sits just above the measured range; high end allows for the misclassification."

completion_factor_all:
  value: 0.93
  low: 0.89
  high: 0.96
  unit: completions per permitted unit
  source: "Census New Residential Construction via FRED, long-run completions per permitted unit, recomputed by scripts/dev/completion_factors.py (lotline.model.completion): PERMITNSA vs COMPUTNSA, 1-year lag; 0.96 (1990-2019), 0.93 (2000-2019), 0.91 (2010-2022)"
  notes: "All housing, for the baseline. Replaces the placeholder 0.90 (0.85-0.95) from the statistical protocol §6 decision table. Range spans the measured windows less the 2-3% of completions in areas that issue no permits."

min_eligible_parcels_publish:
  value: 20
  low: 10
  high: 50
  unit: eligible parcels
  source: "Analysis plan D-015 (Ben, 2026-10-19), matching the V1 scoring floor (D-005, config/params/baseline.yaml v1_min_eligible_parcels); judging finding TR-07"
  notes: "Places with fewer eligible parcels than this are not shown on their own in the tool or reports: their results are folded into the county or region. Small places have rates too noisy to read and few enough parcels that a result could point at individual properties."

results_draws:
  value: 1000
  low: 1000
  high: 1000
  unit: draws per scenario
  source: "Results bundle contract, issue #310 (Ben accepted 2026-11-06: 1,000 draws per scenario)"
  notes: "Draws exported per state and scenario for the app's live sliders (model/results.py). About 1 MB of JSON per state with every scenario."

results_seed:
  value: 20261106
  low: 20261106
  high: 20261106
  unit: random seed
  source: "Lotline convention: fixed seed for the bundle's own draws (completion, displacement), so a bundle is reproducible from config alone"
  notes: "Scenario draws keep their own seeds (adu_simulation_seed etc.); this seeds only the aggregation factors drawn in model/results.py."

overlap_flag_medium_distance:
  value: 0.5
  low: 0.25
  high: 0.75
  unit: log distance outside the calibration range (eligible-weighted median over the state's places)
  source: "Ben, 2026-11-06 (results-bundle PR #311): state overlap flag on the median of hazard.calibration_distance; 0.5 is where adu_extrapolation_widening (1.0) adds a log-sd of 0.5, P10-P90 about x0.5 to x1.9 (the parameter's own example). Validation plan V7 and protocol §5.5: flag places outside the calibration range"
  notes: "High at or below this median distance. Chosen after seeing the five states' distances (MN 0.65, NC 0.94, TX 0.69, OH 1.39, OR 0.11): a display flag, not a pre-registered test. The calibration range is the West Coast reference cities (hazard.yaml); re-basing it on the fit set would be its own analysis-plan entry."

overlap_flag_low_distance:
  value: 1.0
  low: 0.75
  high: 1.5
  unit: log distance outside the calibration range (eligible-weighted median over the state's places)
  source: "Ben, 2026-11-06 (results-bundle PR #311): a log distance of 1 is about 2.7x outside the range on one modifier and doubles the widening at 0.5 (extra log-sd 1.0 at the central widening)"
  notes: "Low above this median distance; medium between this and overlap_flag_medium_distance."

results_origin_year:
  value: 2025
  low: 2025
  high: 2025
  unit: year
  source: "Lotline convention, as in every forward development run (scripts/dev/adu_dev_run.py --origin 2025): the last complete permit year; with forecast_lead_years = 1 (baseline.yaml, D-061) the five-year window is 2027-2031"
  notes: "The bundle's forecast origin; `lotline results --origin` overrides it."
