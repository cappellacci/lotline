# ADU hazard (model/hazard.py): the yearly chance that an eligible single-family parcel adds an ADU, transported
# from strong reforms in high-cost cities by price-to-cost, home equity and mortgage rates, phased in by a ramp.
# Dollar amounts in 2025 dollars. Reference and calibration values are recomputed by scripts/dev/adu_reference.py
# and are fixed (low = high): they describe the reference cities, they are not uncertain inputs.
# "Judgment" marks values with no published estimate; their ranges are wide and include no effect where it is
# plausible.

# ---- The evidence anchor ----

adu_mature_hazard_ref:
  value: 0.001038
  low: 0.000453
  high: 0.003173
  unit: ADU permits per eligible single-family parcel per year, at the reference place's rent, home value and rate
  source: "Estimated, D-019 fit 3 (pre-registered: graded rule shares, gamma place effects, blank fields integrated per place, rule coverage), scripts/dev/calibrate_adu.py: Poisson-gamma maximum likelihood over 16 places, 115 place-years (Minneapolis, Austin 2016-23, 14 Twin Cities suburbs; 2,799 ADU permits), 90% profile-likelihood interval; Raleigh and Durham 2021-25 held out as the test. Earlier fits: 0.000467 (fit 1), 0.000790 (fit 2). Research band: 4 per 1,000, Portland (E046, E047)"
  notes: "About 0.26 of Portland's 4 per 1,000 (D-019 explains the gap). This is the anchor for a typical place; each place's own multiplier varies widely (adu_place_effect_variance). Re-run the script as more rules are coded; no code change needed. Drawn lognormal (D-030): median at the estimate, log-SD 0.592 from the 90% interval ((ln high - ln low) / 3.29, as the fit's own predictive check), then shifted with the judgment parameters it was fitted at (adu_anchor.yaml). Not triangular: triangular(low, value, high) put the median at 1.47e-3, 41% above the estimate."

adu_ref_rent_usd:
  value: 1573
  low: 1573
  high: 1573
  unit: USD per month (2025)
  source: "scripts/dev/adu_reference.py: ACS 2015-2019 B25064 median gross rent, Portland city OR (place 4159000), CPI-U to 2025 dollars"
  notes: "The reference place for adu_mature_hazard_ref. Fixed: describes Portland, not an uncertain input."

adu_ref_home_value_usd:
  value: 519222
  low: 519222
  high: 519222
  unit: USD (2025)
  source: "scripts/dev/adu_reference.py: ACS 2015-2019 B25077 median home value, Portland city OR, CPI-U to 2025 dollars"

adu_ref_mortgage_rate:
  value: 3.99
  low: 3.99
  high: 3.99
  unit: percent (30-year fixed)
  source: "scripts/dev/adu_reference.py: FRED MORTGAGE30US annual means (market_geo_year.mortgage_rate), mean of 2015-2019"

adu_calibration_rent_low_usd:
  value: 1573
  low: 1573
  high: 1573
  unit: USD per month (2025)
  source: "scripts/dev/adu_reference.py: lowest ACS 2015-2019 median gross rent of Portland, Seattle and Los Angeles (2025 dollars): Portland 1,573 (1,248 nominal)"
  notes: "Places below this rent are outside the calibration range: flagged, interval widened."

adu_calibration_rent_high_usd:
  value: 2034
  low: 2034
  high: 2034
  unit: USD per month (2025)
  source: "scripts/dev/adu_reference.py: highest ACS 2015-2019 median gross rent of Portland, Seattle and Los Angeles (2025 dollars): Seattle 2,034 (1,614 nominal); Los Angeles 1,827"

adu_calibration_value_low_usd:
  value: 519222
  low: 519222
  high: 519222
  unit: USD (2025)
  source: "scripts/dev/adu_reference.py: lowest ACS 2015-2019 median home value of Portland, Seattle and Los Angeles (2025 dollars): Portland (412,000 nominal)"

adu_calibration_value_high_usd:
  value: 835671
  low: 835671
  high: 835671
  unit: USD (2025)
  source: "scripts/dev/adu_reference.py: highest ACS 2015-2019 median home value of Portland, Seattle and Los Angeles (2025 dollars): Seattle (663,100 nominal); Los Angeles 802,652"

adu_calibration_rate_low:
  value: 2.96
  low: 2.96
