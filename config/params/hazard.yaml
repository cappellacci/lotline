adu_calibration_rate_high:
  value: 6.81
  low: 6.81
  high: 6.81
  unit: percent (30-year fixed)
  source: "scripts/dev/adu_reference.py: highest annual mean of FRED MORTGAGE30US over 2015-2023"

# ---- Transport: how uptake changes with local conditions ----

adu_rent_to_median_ratio:
  value: 1.0
  low: 0.8
  high: 1.2
  unit: ADU rent / place median gross rent
  source: "Judgment. E039 (CCI 2021): median California ADU rent $2,000 for a small new unit; a new 800 sq ft unit rents near a place's median gross rent (smaller than the median unit, but new)"
  notes: "Applies to target and reference alike, so it matters only through the feasibility threshold."

adu_feasibility_dispersion:
  value: 0.5
  low: 0.25
  high: 0.8
  unit: standard deviation of log(lot's own price-to-cost)
  source: "Judgment. Lots differ in what an ADU costs and earns (garages to convert, lot size, slope: E040, E043); no published spread. Range from near-uniform lots (0.25) to very mixed (0.8)"
  notes: "Sets how fast uptake falls as price-to-cost drops: a place with rent 30% below Portland's gets 17% of Portland's hazard at 0.25, 49% at 0.5 and 66% at 0.8 (other modifiers equal)."

adu_equity_elasticity:
  value: 0.25
  low: 0.0
  high: 0.5
  unit: "% change in hazard per % change in median home value"
  source: "Judgment. Confounder register C22 (owners finance ADUs: Portland 62% cash, 2% construction loans); E045 (~40% used home equity). No published elasticity; range includes no effect"

adu_rate_semi_elasticity:
  value: 0.07
  low: 0.0
  high: 0.15
  unit: share change in hazard per percentage point of mortgage rate
  source: "Judgment. Confounder register C01 and C22 (rates reach ADUs through home-equity and cash-out borrowing, beyond the construction-loan cost already in the pro forma). No published estimate; range includes no effect"
  notes: "At 0.07, a rate 2.6 points above the 2015-19 mean lowers the hazard by about 17%."

adu_fee_per_unit_usd:
  value: 0
  low: 0
  high: 0
  unit: USD per ADU (2025)
  source: "E073 (Terner 2019): many California cities waive ADU fees, others charge up to $50k; the Handbook ADU scenario does not change fees. No fee is assumed for the reference or the target alike"
  notes: "Fixed at 0 until local ADU fees are coded; a local fee would lower that place's price-to-cost."

# ---- Ramp after adoption ----

adu_ramp_half_years:
  value: 2.0
  low: 1.0
  high: 3.5
  unit: years after adoption to reach half the mature hazard
  source: "adu-study-design.md: immediate where conversions and pent-up demand exist (LA garages, E038); 2-3 years to plateau for detached ADUs (Seattle ~3, E044); Portland kept rising ~6 years (E046); confounder C24 (builder learning)"

adu_ramp_slope_years:
  value: 0.75
  low: 0.5
  high: 1.5
  unit: years (logistic scale)
  source: "Judgment, set so the ramp goes from ~20% to ~80% of mature uptake in about 2 years (Seattle's ~3 years to plateau, E044); wider values give Portland's slower rise (E046)"

# ---- Outside the calibration range ----

adu_extrapolation_shared_share:
  value: 1.0
  low: 0.5
  high: 1.0
  unit: share of the extrapolation noise's variance common to every place in a draw
  source: "Choice (D-030). The extrapolation widening stands for error in the transport formula (the shape of F, the equity and rate elasticities), which is the same model error for every place in a draw, not a fresh error per place. Place-to-place differences are already carried by the fitted place effects (adu_place_effect_variance, D-019 fit 3), so a per-place widening term would count them twice. Each draw's noise for place i is sqrt(share) z + sqrt(1 - share) e_i, z and e_i standard normal, so each place keeps the same spread and only the correlation between places changes"
  notes: "Held at the central value in the forecast draws; 0.5 (half shared) is run as a sensitivity (scripts/dev/adu_dev_run.py). Before D-030 the noise was drawn independently per place (share 0), which let it average out in state totals."

adu_extrapolation_widening:
  value: 1.0
  low: 0.5
  high: 2.0
  unit: standard deviation of log(hazard) per unit of log distance outside the calibration range
  source: "Judgment. Statistical protocol §5.5 step 3 and two-prong design: don't extrapolate silently; flag and widen. At 1.0, a place with rent 40% below the reference range (log distance 0.5) gets an extra log-sd of 0.5 (P10-P90 about x0.5 to x1.9)"

adu_place_effect_variance:
  value: 4.735
  low: 2.980
  high: 7.523
  unit: variance of a place's multiplier on the ADU hazard (gamma, mean 1)
  source: "Estimated, D-019 fit 3 (alpha): fitted place multipliers range from ~0 (Eagan, Lakeville, St. Louis Park) to ~11 (Austin)"
  notes: "Each simulation draw gives each place its own multiplier, so a single place's range is very wide (its median is far below its mean); state totals, summed over many independent places, are much tighter. Drawn lognormal around the estimate (D-030): low and high are the 90% interval from the observed-information log-SE 0.281 (adu_anchor.yaml, recomputed on the current fit set; correlation with log theta about 0, so the two are drawn nearly independently), then shifted with the judgment parameters it was fitted at. Before D-030 it was fixed (its uncertainty not propagated)."
