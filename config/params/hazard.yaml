# ADU hazard (model/hazard.py): the yearly chance that an eligible single-family parcel adds an ADU, transported
# from strong reforms in high-cost cities by price-to-cost, home equity and mortgage rates (no ramp-in, D-048).
# Dollar amounts in 2025 dollars. Reference and calibration values are recomputed by scripts/dev/adu_reference.py
# and are fixed (low = high): they describe the reference cities, they are not uncertain inputs.
# "Judgment" marks values with no published estimate; their ranges are wide and include no effect where it is
# plausible.

# ---- The evidence anchor ----

adu_mature_hazard_ref:
  value: 0.000659
  low: 0.000443
  high: 0.001023
  unit: ADU permits per eligible single-family parcel per year, at the reference place's rent, home value and rate
  source: "Estimated, D-048 (adopted 2026-11-05): D-041's fit 3 (graded rule shares, gamma place effects, blank fields integrated per place, rule coverage, D-041 count rules) with no ramp, scripts/dev/calibrate_adu.py: Poisson-gamma maximum likelihood over 51 places, 296 place-years in MN, NC, OH and TX (D-039 fit set), 90% profile-likelihood interval; Raleigh and Durham 2021-25 held out as the test. Earlier: 0.001038 (D-019 fit 3, 16 places, with the ramp), 0.001232 (D-041, with the ramp; never written here). Research band: 4 per 1,000, Portland (E046, E047)"
  notes: "About 0.16 of Portland's 4 per 1,000. Lower than D-019's 0.001038 because with no ramp a young rule counts at full strength, so the same permits imply a lower rate. This is the anchor for a typical place; each place's own multiplier varies widely (adu_place_effect_variance). Drawn lognormal (D-030): median at the estimate, log-SD 0.254 from the 90% interval ((ln high - ln low) / 3.29), then shifted with the judgment parameters it was fitted at (adu_anchor.yaml)."

adu_ref_rent_usd:
