  low: 519222
  high: 519222
  unit: USD (2025)
  source: "scripts/dev/adu_reference.py: ACS 2015-2019 B25077 median home value, Portland city OR, CPI-U to 2025 dollars"

adu_ref_mortgage_rate:
  value: 3.99
