# ADU hazard (model/hazard.py): the yearly chance that an eligible single-family parcel adds an ADU, transported
# from strong reforms in high-cost cities by price-to-cost, home equity and mortgage rates (no ramp-in, D-048).
# Dollar amounts in 2025 dollars. Reference and calibration values are recomputed by scripts/dev/adu_reference.py
# and are fixed (low = high): they describe the reference cities, they are not uncertain inputs.
# "Judgment" marks values with no published estimate; their ranges are wide and include no effect where it is
# plausible.

# ---- The evidence anchor ----

adu_mature_hazard_ref:
  value: 0.000224
  low: 0.000170
  high: 0.000303
  unit: ADU permits per eligible single-family parcel per year, for a suburb at the reference place's rent, home value and rate
  source: "Estimated, D-096 form refit on main's rule rows after PR #444 (Form A + place types; config approved by Ben 2026-11-16): central fit over 70 places, 498 place-years in MN, NC, OH, TX and OR (St. Paul held out; UNKNOWN-PLACEHOLDER place-years left out), 90% profile-likelihood interval, offline (scripts/dev/adu_refit_fixed_rows.py adu_config_fit.py, reports/adu-final-config/fit.json). Earlier: 0.000240 (D-096, before #444), 0.000448 (D-088, pre-check rows), 0.000308 (D-053), 0.000659 (D-048), 0.001038 (D-019 fit 3). Research band: 4 per 1,000, Portland (E046, E047)"
  notes: "The rate of a suburb, the reference place type. A core city's hazard is this times exp(adu_types_core_log_multiplier) (x5.7), and a town's is this times a draw from D-089's town prior (adu_place_types.yaml). Lower than D-088's 0.000448 mainly because partial rules now count at m_x = 0.7, not 0.4, so the same counts need less base rate. Drawn lognormal (D-030): median at the estimate, log-SD from the 90% interval, then shifted with the judgment parameters (adu_anchor.yaml slopes, recomputed for this fit by scripts/dev/adu_types_slopes.py)."

adu_ref_rent_usd:
  value: 1573
  low: 1573
  high: 1573
  unit: USD per month (2025)
  source: "scripts/dev/adu_reference.py: ACS 2015-2019 B25064 median gross rent, Portland city OR (place 4159000), CPI-U to 2025 dollars"
  notes: "The reference place for adu_mature_hazard_ref. Fixed: describes Portland, not an uncertain input."

adu_ref_home_value_usd:
