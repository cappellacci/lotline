# ADU place types (analysis plan D-088, accepted by Ben 2026-11-14; "I agree that plan A + place types makes the
# most sense") and D-089's town prior (accepted 2026-11-14). Ben approved writing the fitted values to config on
# 2026-11-14 ("Open the config PR") and wiring them into the engine ("Wire it here").
#
# Read by model/scenarios/adu.py: each place carries a type (core city, suburb or town, from national data,
# adu_types.jurisdiction_types). A core city's hazard is multiplied by exp(β_core), β_core drawn per draw; a
# town's by exp(s z), z one standard normal per draw and state; a suburb's by 1. The rest of Form A + P (θ, α,
# m_o, m_x) is in hazard.yaml and adu.yaml; the anchor's draw terms (observed information and judgment slopes,
# recomputed for this fit) are in adu_anchor.yaml.
#
# Central fit: 64 places, 395 place-years in MN, NC, OH, TX and OR (D-088 fit set; St. Paul held out), offline,
# scripts/dev/adu_types_refit.py (reports/adu-place-types/fits.csv, variant central, fold all, form A+P).
# Intervals are 90%: profile likelihood for θ and the core term, observed information for α.

# ---- How places are typed (D-088, fixed before any fit; national data only) ----

adu_type_core_share:
  value: 0.3333
  low: 0.3333
  high: 0.3333
  unit: share of the metro's largest place's housing units
  source: "D-088: in each metropolitan area (OMB 2023 CBSA delineation), the place with the most housing units (ACS 2011-15 B25024_001) is a core city, and so is any place with at least a third of the largest's units. Other metro places (townships and unincorporated areas included) are suburbs; micropolitan or no CBSA are towns. Mirrors lotline.model.adu_types.CORE_SHARE (tested equal)"

adu_type_units_end_year:
  value: 2015
  low: 2015
  high: 2015
  unit: last year of the ACS 5-year vintage
  source: "D-088: housing units for the core-city ranking from ACS 2011-15, before the 2016 fit window, so the type can't be moved by the ADUs it is meant to explain"

adu_type_min_fit_places:
  value: 8
  low: 8
  high: 8
  unit: fit places of the type
  source: "D-088 merge rule: a type needs at least this many fit places (in at least adu_type_min_fit_states states) to get its own term; otherwise town merges into suburb, then core into suburb. In the central fit town had none and merged into suburb. Mirrors adu_types.merge_small's default (tested equal)"

adu_type_min_fit_states:
  value: 3
  low: 3
  high: 3
  unit: states
  source: "D-088 merge rule, with adu_type_min_fit_places. Core cities: 16 places in all 5 states, kept"

# ---- Form A + P, fitted (D-088 central fit). θ, α, m_o and m_x are in hazard.yaml and adu.yaml ----

adu_types_core_log_multiplier:
  value: 1.199
  low: 0.546
  high: 1.898
  unit: log of a core city's hazard multiplier over a suburb's (β_core)
  source: "Estimated, D-088 (run 2026-11-14): Form A + P central fit, 90% profile-likelihood interval; x3.3 (x1.7 to x6.7). D-088's rule adopted it: tier-1 log-score gain +7.2 against 2 SE of 6.1. Leave-one-state-out fits +0.91 to +1.26, every interval above 0"
  notes: "Drawn per draw as N(β̂, se), se = (high - low) / (2 x 1.645) = 0.411, shared by every core city in the draw (scenarios.adu.type_log_multipliers). Suburbs get 0. Towns get the D-089 prior below."

# ---- Towns (D-089) ----

adu_types_town_prior_sd:
  value: 0.729
  low: 0.729
  high: 0.729
  unit: SD of a town's log hazard multiplier over a suburb's (prior N(0, s²), one draw per draw shared by a state's towns)
  source: "D-089 (accepted 2026-11-14): no fit place is a town, so towns get a prior centred on the suburb rate with s = |β̂_core| / 1.645 = 1.199 / 1.645, so a town's 90% range (x0.30 to x3.3) is as wide as the one type gap measured, either way. Fixed by rule, not estimated"
  notes: "Towns hold 9-30% of a state's eligible lots but 1-5% of its expected ADUs, so the prior moves no state's P90 by more than 3% (reports/adu-state-profiles)."
