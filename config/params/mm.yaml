# Missing-middle estimation panel (model/estimate_mm.py, analysis plan D-024, pre-registered). Choices flagged
# for Ben are marked; D-024 is approved before any estimate is run.

mm_panel_first_year:
  value: 2010
  low: 2010
  high: 2010
  unit: calendar year
  source: "Choice (D-024): the first year with missing-middle eligible-parcel rolls (rule 1.1) and ACS 5-year estimates for every place; gives Minneapolis and Durham ten pre-adoption years"

mm_panel_last_year:
  value: 2025
  low: 2025
  high: 2025
  unit: calendar year
  source: "Choice (D-024): the last full year of Census BPS place permits"

mm_estimation_min_population:
  value: 10000
  low: 10000
  high: 50000
  unit: people (2020 Census)
  source: "Choice, flagged for Ben (D-024): comparison places of at least 10,000 people, the lower edge of D-022's middle size band; every treated place has 50,000+. 50,000+ (D-022's top band) is the robustness sample"
  notes: "Smaller places permit 2-4 unit buildings so rarely that they add zeros, not information about the reform."

mm_dose_grade_permit:
  value: 0.3333
  low: 0.3333
  high: 0.3333
  unit: share of the by-right dose
  source: "Choice, flagged for Ben (D-024), mirroring D-023's equal steps: a rule that allows 2-4 units only by permit or conditional use counts 1/3 of the same rule by right. The binary by-right dose is D-024's robustness check"
