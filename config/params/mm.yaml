# Missing-middle estimation panel (model/estimate_mm.py, analysis plan D-024, pre-registered). D-024 was approved
# by Ben on 2026-10-20, before any estimate was run.

mm_panel_first_year:
  value: 2010
  low: 2010
  high: 2010
  unit: calendar year
  source: "Choice (D-024): the first year with missing-middle eligible-parcel rolls (rule 1.1) and ACS 5-year estimates for every place; gives Minneapolis and Durham ten pre-adoption years"

mm_panel_last_year:
  value: 2025
  low: 2025
  high: 2025
  unit: calendar year
  source: "Choice (D-024): the last full year of Census BPS place permits"

mm_estimation_min_population:
  value: 10000
  low: 10000
  high: 50000
  unit: people (2020 Census)
  source: "Choice (D-024, approved by Ben 2026-10-20): comparison places of at least 10,000 people, the lower edge of D-022's middle size band; every treated place has 50,000+. 50,000+ (D-022's top band) is the robustness sample"
  notes: "Smaller places permit 2-4 unit buildings so rarely that they add zeros, not information about the reform."

mm_dose_grade_permit:
  value: 0.3333
  low: 0.3333
  high: 0.3333
  unit: share of the by-right dose
  source: "Choice (D-024, approved by Ben 2026-10-20), mirroring D-023's equal steps: a rule that allows 2-4 units only by permit or conditional use counts 1/3 of the same rule by right. The binary by-right dose is D-024's robustness check"

mm_estimation_bootstrap_draws:
  value: 999
  low: 999
  high: 999
  unit: draws
  source: "D-024: wild cluster score bootstrap by place, 999 draws (as D-023)"

mm_estimation_permutations:
  value: 999
  low: 999
  high: 999
  unit: reassignments
  source: "D-024: randomization inference reassigns the treated places' adoption and dose paths within state and size band, 999 times"

mm_transport_widening:
  value: 1.0
  low: 1.0
  high: 1.0
  unit: standard deviation of log(predicted mean) per unit log distance outside the fitted modifier range
  source: "D-024: places outside the fitted modifier range are flagged and their intervals widened as in hazard.widen; same scale as adu_transport_widening (1.0, judgment)"

# ---- Handbook missing-middle scenario (model/scenarios/mm.py, D-063, approved by Ben 2026-11-08) ----

mm_scenario_draws:
  value: 4000
  low: 4000
  high: 4000
  unit: draws
  source: "Choice (D-063): Monte Carlo draws for the statewide P10/P50/P90, as many as the ADU scenario's order of magnitude"

mm_scenario_seed:
  value: 20261108
  low: 20261108
  high: 20261108
  unit: seed
  source: "Choice (D-063): fixed so a run regenerates"

mm_rule_min_coded:
  value: 5
  low: 5
  high: 5
  unit: coded places
  source: "Choice (D-063), as adu_rule_min_coded (D-022): a size band needs at least 5 coded places to supply the dose of places with no coded rule; otherwise every coded place in the state"

mm_teardown_share_scale:
  value: 1.0
  low: 0.5
  high: 1.0
  unit: share of a place's house share of eligible parcels
  source: "Judgment (D-063 choice 2): new 2-4 unit buildings replace a house in proportion to the share of eligible parcels that hold one (ADU-eligible over missing-middle eligible parcels, from the same rolls); 1.0 = builders pick lots at random, 0.5 = they favour vacant lots twice as much"
  notes: "No local split of new 2-4 unit buildings by prior use is coded; Portland's RIP monitoring is the outside check (docs/research/mm-uptake-evidence.md)."

# ---- D-082 counting protocol (model/mm_counts.py; D-082 (proposed) §2-§3, not yet approved by Ben) ----
# Code only: no count has been run with these values.

mm_strong_parcel_fill:
  value: 0.85
  low: 0.85
  high: 0.85
  unit: share of permit rows with a parcel ID
  source: "D-082 (proposed) §2: a permit source is strong only if a parcel ID is filled on at least 85% of rows"

mm_strong_min_pre_years:
  value: 3
  low: 3
  high: 3
  unit: years before the place's event
  source: "D-082 (proposed) §2: a strong source covers at least 3 years before the place's event"

mm_coverage_k_low:
  value: 0.8
  low: 0.8
  high: 0.8
  unit: permit buildings / BPS 2-4 unit buildings
  source: "D-082 (proposed) §2: the source enters if 0.8 <= k_src (D-072's coverage screen)"

mm_coverage_k_high:
  value: 1.25
  low: 1.25
  high: 1.25
  unit: permit buildings / BPS 2-4 unit buildings
  source: "D-082 (proposed) §2: upper bound k_src <= 1.25, since permits can include conversions"

mm_collapse_min_units:
  value: 2
  low: 2
  high: 2
  unit: units per collapsed building
  source: "D-082 (proposed) §2: a collapsed building whose summed units fall outside 2-4 is reported and left out"

mm_collapse_max_units:
  value: 4
  low: 4
  high: 4
  unit: units per collapsed building
  source: "D-082 (proposed) §2: a collapsed building whose summed units fall outside 2-4 is reported and left out"

mm_ratio_min_buildings:
  value: 50
  low: 50
  high: 50
  unit: new 2-4 unit buildings in a source
  source: "D-082 (proposed) §3: a ratio's range is the lowest and highest source ratio on at least 50 buildings"

mm_teardown_demolition_window:
  value: 2
  low: 2
  high: 2
  unit: years either side of the 2-4 building's issue year
  source: "D-082 (proposed) §3: s_td counts a demolition permit on the same parcel within +/-2 years"

mm_roll_merge_growth:
  value: 0.20
  low: 0.20
  high: 0.20
  unit: share increase in lot area between rolls
  source: "D-082 (proposed) §2, as wake_roll_diff.MERGE_ACRE_GROWTH: lot area up more than 20% is a possible merge, reported and left out"

mm_coverage_interval_z:
  value: 1.6449
  low: 1.6449
  high: 1.6449
  unit: standard normal quantile
  source: "Choice (mm-counts code PR, D-082 (proposed)): 90% two-sided interval on k_src, as the D-074 k interval (validation.undercount.Z90)"
