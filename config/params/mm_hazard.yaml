# Missing-middle uptake hazard (D-037 route 1, as amended: calibrated on our own four states; D-038): the yearly
# chance that an eligible single-family-zoned parcel (rule 1.1, D-014) gets a new 2-4 unit building, phased in
# by a ramp. It plays the role adu_mature_hazard_ref plays for ADUs (hazard.yaml):
#     expected buildings = baseline + θ × u_place × eligible parcels × dose × F(PCR) / F(1) × ramp(t)
# Estimated by scripts/dev/calibrate_mm.py (src/lotline/model/calibrate_mm.py) on 15 MN, NC, OH and TX places
# that adopted a by-right rule in 2013-2025; results in reports/mm-d038/. Outside studies (Portland, Houston,
# Auckland, SB 9: docs/research/mm-uptake-evidence.md) are a plausibility check only.
# Kept out of hazard.yaml (D-037 named that file) because scenarios/adu.py draws every hazard.yaml parameter
# from one random stream: a new key there would shift the ADU draws and the V5 ADU numbers (D-038).

# ---- The anchor ----

mm_mature_hazard_ref:
  value: 0.001076
  low: 0.000362
  high: 0.005347
  unit: new 2-4 unit buildings per eligible parcel per year, mature, full dose, where a rental duplex's value equals its cost before profit (PCR = 1)
  source: "Estimated, D-038 (pre-registered), scripts/dev/calibrate_mm.py: Poisson-gamma maximum likelihood over 15 places, 74 post-reform place-years (BPS 2-4 unit buildings over each place's pre-reform mean x its growth in other homes), 90% profile-likelihood interval; Minneapolis, Durham, Durham County and Raleigh held out as the D-037 tests"
  notes: "Rests heavily on Houston's and Austin's 2024-25 years: without Houston 0.57 per 1,000, without both 0.24 (exploratory, reports/mm-d038/exploratory_fits.csv); the leave-one-out refits on data before each target's reform gave 0.08-0.45. The placebo date (T - 3) gives 0.32 per 1,000 (0.10-1.84): part of the measured excess may be growth the control does not remove. Implied mature rates at each place's own dose and PCR, 0.07-0.76 per 1,000, sit inside the outside evidence (Portland 0.55-0.85 projects, Houston 0.35). Drawn lognormal (as D-030): median at the estimate, log-SD (ln high - ln low) / 3.29 = 0.819. Kept by Ben over the D-042 refit (2026-11-03; θ 0.17 per 1,000, 0.056-0.89, which did not beat no effect in its backtest, reports/mm-d042). D-038 predates the Austin and Houston pre-reform rows, so it counts building types those places already allowed."

mm_place_effect_variance:
  value: 7.29
  low: 3.18
  high: 19.78
  unit: variance of a place's multiplier on the missing-middle hazard (gamma, mean 1)
  source: "Estimated, D-038 (alpha, 90% profile-likelihood interval)"
  notes: "Very wide, as for ADUs (adu_place_effect_variance 4.7): a single place's range is wide and its median far below its mean; state totals, summed over many places, are tighter. Drawn lognormal around the estimate from its interval."

mm_units_per_project:
  value: 2.08
  low: 2.04
  high: 4.0
  unit: homes per new 2-4 unit building (gross, before any demolished house)
  source: "Census BPS, the 15 fit places 2016-2025: 10,210 homes in 4,912 buildings (D-038). Low and high: the lowest and highest state ratios (NC 2.04, OH 2.75, TX 2.07, MN 4.0 on 10 buildings)"
  notes: "D-038 named local permit files as the source; they give 0.75-2.43 homes per 2-4 unit 'building', below the minimum of 2, because they file one permit per unit or per side of a duplex, so they cannot count buildings. BPS was the pre-registered check and is used instead. BPS 2-4 unit buildings are mostly duplexes (Houston); Portland's mix (3.4, fourplexes) is the outside comparison."

# ---- Ramp after adoption ----

mm_ramp_half_years:
  value: 2.0
  low: 1.5
  high: 2.5
  unit: years after adoption to reach half the mature hazard
  source: "Estimated, D-038: profile likelihood on the grid 0.5-6.0; 2.0 is the maximum and the 90% set holds no other grid point, so low and high are the neighbouring grid points"
  notes: "Identified only over the ages the data cover: 80% of the exposure is at ages 0.5-2.5, most of it Houston's and Austin's two years. The late years rest on Wilson, Morrisville and Wake Forest's small counts. Outside series suggest 1.5-5 years (Portland, Auckland, Houston); widening the range to that is for Ben to decide (D-038)."

mm_ramp_slope_years:
  value: 0.75
  low: 0.5
  high: 1.5
  unit: years (logistic scale)
  source: "Judgment, held fixed in the D-038 fit (as adu_ramp_slope_years): about 2 years from 20% to 80% of the mature hazard"
  notes: "At half 2.0 and slope 0.75: year 1 0.21, year 2 0.50, year 3 0.79, year 4 0.94, year 5 0.98 of the mature hazard."

# ---- Feasibility transport ----

mm_feasibility_dispersion:
  value: 0.5
  low: 0.25
  high: 0.8
  unit: standard deviation of log(lot's own price-to-cost) for a rental duplex
  source: "Judgment (D-038), the ADU value (adu_feasibility_dispersion): lots differ in what a 2-4 unit building costs and earns (existing house to buy out, lot size, slope); no published spread. Range from near-uniform lots (0.25) to very mixed (0.8)"
  notes: "F = Φ((ln PCR − ln(1 + developer_margin)) / σ), relative to F at PCR = 1. The anchor moves with it (fit at 0.25: 2.71 per 1,000; at 0.8: 0.93), so draw them together or hold σ at its value."
