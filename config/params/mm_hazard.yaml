# Missing-middle uptake hazard (D-037 route 1, as amended: calibrated on our own four states; D-038): the yearly
# chance that an eligible single-family-zoned parcel (rule 1.1, D-014) gets a new 2-4 unit building, phased in
# by a ramp. It plays the role adu_mature_hazard_ref plays for ADUs (hazard.yaml):
#     expected buildings = baseline + θ × u_place × eligible parcels × dose × F(PCR) / F(1) × ramp(t)
# Estimated by scripts/dev/calibrate_mm_d054.py (src/lotline/model/calibrate_mm.py) on 13 MN, NC, OH and TX places
# whose rule raised the unit cap in 2013-2025, counting only the newly allowed building classes (D-054 main fit,
# adopted by D-055); results in reports/mm-d054/. D-038's values (reports/mm-d038/) are in this file's history. Outside studies (Portland, Houston,
# Auckland, SB 9: docs/research/mm-uptake-evidence.md) are a plausibility check only.
# Kept out of hazard.yaml (D-037 named that file) because scenarios/adu.py draws every hazard.yaml parameter
# from one random stream: a new key there would shift the ADU draws and the V5 ADU numbers (D-038).

# ---- The anchor ----

mm_mature_hazard_ref:
  value: 0.0001235
  low: 0.0000325
  high: 0.001006
  unit: new 2-4 unit buildings per eligible parcel per year, mature, full dose, where a rental duplex's value equals its cost before profit (PCR = 1)
  source: "Estimated, D-054 main fit (b), adopted by D-055 (Ben, 2026-11-06): D-038's Poisson-gamma likelihood and own-growth baseline on D-042's events (a rise in the unit cap, building classes above the prior cap), 13 places, 69 place-years, 90% profile-likelihood interval; Minneapolis, Durham and Durham County held out as test places"
  notes: "Replaces D-038's 1.08 per 1,000, which predates Austin's and Houston's [predates] rows. Leave-one-state-out (D-054): North Carolina useful; Texas missed by every model, because Lubbock's own-growth baseline (191 expected, 25 built); MN and OH carry no information. Folds give 0.013 (without NC) to 0.24 (without TX) per 1,000: most of the excess is NC towns (Wake Forest, Burlington) and Houston. The test places built more than the median (Durham city 100 against 33-54). Not blind: V9 Oregon re-scored with these values (D-055, reports/v9-oregon-d055/): headline 2018-2025 CRPS 84.8, against 690.6 for D-038's and 279.5 for no reform; place ranges are too narrow (34% above P90). Drawn lognormal: median at the estimate, log-SD (ln high - ln low) / 3.29 = 1.043."

mm_place_effect_variance:
  value: 8.415
  low: 2.80
  high: 32.4
  unit: variance of a place's multiplier on the missing-middle hazard (gamma, mean 1)
  source: "Estimated, D-054 main fit (alpha, 90% profile-likelihood interval), adopted by D-055"
  notes: "Very wide, as for ADUs: a single place's range is wide and its median far below its mean; state totals, summed over many places, are tighter. D-038 had 7.29 (3.18-19.78). Drawn lognormal around the estimate from its interval."

mm_units_per_project:
  value: 2.08
  low: 2.04
  high: 4.0
  unit: homes per new 2-4 unit building (gross, before any demolished house)
  source: "Census BPS, the 15 fit places 2016-2025: 10,210 homes in 4,912 buildings (D-038). Low and high: the lowest and highest state ratios (NC 2.04, OH 2.75, TX 2.07, MN 4.0 on 10 buildings)"
  notes: "D-038 named local permit files as the source; they give 0.75-2.43 homes per 2-4 unit 'building', below the minimum of 2, because they file one permit per unit or per side of a duplex, so they cannot count buildings. BPS was the pre-registered check and is used instead. BPS 2-4 unit buildings are mostly duplexes (Houston); Portland's mix (3.4, fourplexes) is the outside comparison."

# ---- Ramp after adoption ----

mm_ramp_half_years:
  value: 0.5
  low: 0.5
  high: 1.0
  unit: years after adoption to reach half the mature hazard
  source: "Estimated, D-054 main fit (profile likelihood on the grid 0.5-6.0), adopted by D-055: 0.5 is the grid floor and the 90% set holds no other grid point, so high is the neighbouring grid point (as D-038)"
  notes: "On the grid floor: the data show the effect from the first year and cannot place the ramp. θ and the half-way point trade off (D-054: leaving Wake Forest out gives 2.6 per 1,000 at half 6.0), so draw them together or hold the half-way point at its value, as V9 and D-051 do. Outside series suggest 1.5-5 years (Portland, Auckland, Houston). D-038 had 2.0 (1.5-2.5)."

mm_ramp_slope_years:
  value: 0.75
  low: 0.5
  high: 1.5
  unit: years (logistic scale)
  source: "Judgment, held fixed in the D-038 fit (as adu_ramp_slope_years): about 2 years from 20% to 80% of the mature hazard"
  notes: "At half 0.5 and slope 0.75 (D-055): year 1 (age 0.5) 0.50, year 2 0.79, year 3 0.94, year 4 0.98, year 5 1.00 of the mature hazard (ages at mid-year). At D-038's half 2.0: 0.12, 0.34, 0.66, 0.88, 0.97."

# ---- Feasibility transport ----

mm_feasibility_dispersion:
  value: 0.5
  low: 0.25
  high: 0.8
  unit: standard deviation of log(lot's own price-to-cost) for a rental duplex
  source: "Judgment (D-038), the ADU value (adu_feasibility_dispersion): lots differ in what a 2-4 unit building costs and earns (existing house to buy out, lot size, slope); no published spread. Range from near-uniform lots (0.25) to very mixed (0.8)"
  notes: "F = Φ((ln PCR − ln(1 + developer_margin)) / σ), relative to F at PCR = 1. The anchor moves with it (fit at 0.25: 2.71 per 1,000; at 0.8: 0.93), so draw them together or hold σ at its value."
