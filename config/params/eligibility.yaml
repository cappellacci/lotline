# Eligible-parcel rule (build/eligible.py, BUILD_PLAN §5.3). Every value has a source; ranges are for sensitivity.
# Toggles use 1 (on) / 0 (off) so they fit the Parameter model (value, low, high).

min_lot_sqft_adu:
  value: 0
  low: 0
  high: 0
  unit: sq ft
  source: "Handbook benchmark ADU definition: one ADU per parcel with an existing single-family building; no lot-size minimum"
  notes: "Sensitivity range to be sourced (local ADU minimum-lot rules) by WS-ENGINE before use; held at 0 until then."

min_lot_sqft_missing_middle:
  value: 0
  low: 0
  high: 0
  unit: sq ft
  source: "Handbook benchmark missing-middle definition: setbacks and lot coverage assumed not to constrain"
  notes: "Sensitivity range to be sourced (e.g. C10 minimum-lot reforms) by WS-ENGINE before use."

exclude_hoa:
  value: 1
  low: 0
  high: 1
  unit: toggle
  source: "Statistical protocol §5.2: exclusions (HOA, floodplain, historic districts) where the data allow; C12"
  notes: "Applied only where the parcel records an HOA; unknown is kept."

exclude_floodplain:
  value: 1
  low: 0
  high: 1
  unit: toggle
  source: "Statistical protocol §5.2; C38"
  notes: "Applied only where floodplain status is known."

exclude_historic_district:
  value: 1
  low: 0
  high: 1
  unit: toggle
  source: "Statistical protocol §5.2"
  notes: "Applied only where historic-district status is known."

quality_medium_max_unknown_share:
  value: 0.05
  low: 0.0
  high: 0.25
  unit: share of eligible parcels
  source: "Lotline convention (proposed, to confirm at pre-registration): denominator quality bands"
  notes: "Up to this share of eligible parcels resting on an assumption (unknown zoning or lot size) keeps quality 'high'; above it, 'medium'."

quality_low_min_unknown_share:
  value: 0.5
  low: 0.25
  high: 0.75
  unit: share of eligible parcels
  source: "Lotline convention (proposed, to confirm at pre-registration): denominator quality bands"
  notes: "At or above this share resting on assumptions, quality is 'low'. ACS fallback denominators are always 'low'."

scale_max_year_gap:
  value: 3
  low: 0
  high: 5
  unit: years
  source: "Lotline convention (issue #208, option 1 approved by Ben 2026-10-21): a roll anchors the ACS series only if an ACS 5-year end year lies within this many years of the roll year"
  notes: "Rolls newer than the latest ACS release (NC OneMap 2026 vs ACS 2024) are matched to the nearest ACS end year. A roll further than this from any ACS year scales nothing, and its jurisdiction keeps only its real roll years."
