# Handbook ADU scenario (model/scenarios/adu.py). The hazard is in hazard.yaml; the net-new and formalization
# shares are in aggregate.yaml.

adu_handbook_min_sqft:
  value: 600
  low: 600
  high: 600
  unit: sq ft
  source: "Handbook benchmark ADU scenario: one ADU per eligible single-family parcel, at least 600 sq ft, no parking requirement"
  notes: "Fixed by the Handbook. A local rule capping ADUs below this size counts as a partial rule. The ADU prototype (proforma.yaml adu_sqft, 600-1,000) never goes below it."

adu_partial_rule_share:
  value: 1.0
  low: 1.0
  high: 1.0
  unit: share of Handbook uptake reached under current local rules (m_x)
  source: "Estimated, D-053 (fit 3's pre-registered rule, Ben 2026-11-06): five-state fit (MN, NC, OH, TX, OR; 53 places), profile maximum 1.0, 90% profile interval 1.0-1.0 (grid 0.1-1.0), narrower than the judgment range 0.1-0.6, so estimated. Set by Bend 2016-17 (its own rule required one parking space; 37 and 39 ADU permits, as many as under its later full rules); without Bend the share is flat between 0.3 and 1.0. Judgment before the fit: 0.3, low 0.1, high 0.6 (adu-study-design.md: DC <30/yr E046, New Hampshire 0.1-1.5 per 1,000 houses E056; E053; C21)"
  notes: "Applies where ADUs are allowed but with parking, a permit by conditional use (not by right), attached ADUs only or a cap under 600 sq ft (owner occupancy has its own share). At 1.0 such a rule counts as a full one. It rests on two place-years in one city, so the judgment value 0.3 is reported as a sensitivity (D-053). A rule failing both owner occupancy and another condition gets m_o x m_x."

adu_owner_occupancy_share:
  value: 1.0
  low: 0.9
  high: 1.0
  unit: share of Handbook uptake reached when owner occupancy is the only restriction (m_o)
  source: "Estimated, D-019 fit 3 (pre-registered): profile maximum 1.0, 90% profile interval 0.9-1.0 (grid 0.1-1.0), narrower than the judgment range 0.2-1.0, so estimated. Minneapolis built more ADUs under its owner-occupancy rule (2016-20) than after dropping it. Judgment before the fit: 0.5"
  notes: "Owner-occupancy rules show no measurable effect on permitted ADUs in these places (most ADUs are built by owner-occupants: Portland 62% cash, C22, E045)."

adu_observed_years:
  value: 4
  low: 4
  high: 4
  unit: years (ending at the data origin)
  source: "WS-NC-GUTCHECK (2026-11-09; analysis plan deviation of that date): the observed ADU floor is the mean of the 4 years ending at the data origin, replacing the fixed 2019-2022 window of D-019. NC's ADU-flagging places (holdouts left out) permitted 25, 24, 61, 100 ADUs in 2019-22 and 146, 109, 123 in 2023-25, so the fixed window put the no-reform forecast at 78 a year against 126 observed (reports/diagnostics/nc/README.md). For origin 2022 the window is 2019-2022, D-019's own."
  notes: "Four years, D-019's length. A held-out place's window ends the year before its holdout starts (Charlotte and Mecklenburg County 37119: 2019-2022; St. Paul: 2020-2023), so no held-out outcome is read and a partly held-out year never reads as a low count. D-019 stopped at 2022 to stay before the 2023 rate shock; a forward run forecasts the post-shock market, so the post-shock years are the relevant floor."

adu_simulation_draws:
  value: 1000
  low: 500
  high: 5000
  unit: draws
  source: "Choice: P10/P90 of 1,000 draws move by under 2% between seeds on the development run"

adu_simulation_seed:
  value: 20261020
  low: 0
  high: 4294967295
  unit: random seed
  source: "Choice: a fixed seed makes every run reproducible"

# ---- Unknown rules (D-022): anything not coded is unknown ----

adu_rule_band_small_max_pop:
  value: 10000
  low: 10000
  high: 10000
  unit: 2020 population (upper edge of the small-place band)
  source: "Choice (D-022, Ben 2026-10-20): place-size bands <10k, 10-50k, 50k+ for the rule priors of places with no coded ADU rule"

adu_rule_band_mid_max_pop:
  value: 50000
  low: 50000
  high: 50000
  unit: 2020 population (upper edge of the middle band)
  source: "Choice (D-022, Ben 2026-10-20): place-size bands <10k, 10-50k, 50k+"

adu_rule_min_coded:
  value: 5
  low: 5
  high: 5
  unit: coded places (or coded field values)
  source: "Choice (D-022): a state-and-band rule prior, or a state's field probability, needs at least 5 coded places (values); otherwise the state's pooled share, then the all-state share"

adu_unknown_rule_age_years:
  value: 10
  low: 10
  high: 10
  unit: years
  source: "Choice (D-022): a sampled rule with no known date is treated as long in force (ramp ~1), so current-rules uptake under it is mature. Most coded ADU rules in force date from 2014-2023"

# ---- Rule coverage (D-021) ----

adu_rule_zoned_coverage_share:
  value: 0.75
  low: 0.75
  high: 0.75
  unit: share of eligible single-family lots covered
  source: "Judgment (D-021): a rule limited to listed zoning districts or a lot-size minimum, where the parcel roll has no zoning or lot size to measure it. Coded zone lists are mostly a place's main single-family districts (e.g. Austin SF-1 to SF-3), so most eligible lots are covered"
  notes: "Used only where parcels can't measure coverage; measured shares replace it as rolls gain zoning. Fixed in a run (not sampled)."

adu_rule_limited_coverage_share:
  value: 0.2
  low: 0.2
  high: 0.2
  unit: share of eligible single-family lots covered
  source: "Judgment (D-021): a rule whose coverage text names a limited area (an overlay, a half-mile corridor, new subdivisions, historic districts, transit areas) with no zone list to measure it, e.g. St. Paul's 2016 Green Line rule, Raleigh's 2019 overlay"

# ---- D-023 estimation: dose grades (choice to confirm; D-023 orders the grades but gives no values) ----

adu_dose_grade_permit:
  value: 0.3333
  low: 0.3333
  high: 0.3333
  unit: dose (share of a by-right rule without owner occupancy)
  source: "Choice, flagged for Ben (D-023 orders the grades none < permit or conditional use < by right with owner occupancy < by right without it, with no values): equal steps, 1/3. The binary by-right dose is D-023's robustness check"

adu_dose_grade_owner:
  value: 0.6667
  low: 0.6667
  high: 0.6667
  unit: dose
  source: "Choice, flagged for Ben (D-023 grade order; equal steps): by right with owner occupancy, 2/3"

adu_dose_grade_by_right:
  value: 1.0
  low: 1.0
  high: 1.0
  unit: dose
  source: "D-023: by right without owner occupancy is the full dose"

adu_estimation_bootstrap_draws:
  value: 999
  low: 999
  high: 999
  unit: draws
  source: "D-023: wild cluster bootstrap by place, 999 draws"

adu_estimation_permutations:
  value: 999
  low: 999
  high: 999
  unit: permutations
  source: "Choice: randomization inference permuting adoption years among treated places (D-023 asks for it, not its size); 999 matches the bootstrap"

adu_transport_widening:
  value: 1.0
  low: 1.0
  high: 1.0
  unit: standard deviation of log(predicted mean) per unit distance outside the Minnesota modifier range
  source: "D-023: places outside the Minnesota modifier range are flagged and their intervals widened as in hazard.widen; same scale as adu_extrapolation_widening (1.0, judgment)"

# ---- Flag undercount k by permit source (D-074, D-075 step 2, D-078) ----
# k scales the counted ADU permits of a source (fit inputs, the D-070 observed floor, the historical_floor
# check and tests A-C), never eligible lots. A table, not a single parameter: loaded by
# lotline.config.load_undercount and drawn by lotline.model.undercount. `low`-`high` is the row's `interval`
# (two-sided); the draw is a split lognormal with the median at `value` and those ends at the interval's
# quantiles. kind: field (a city's own ADU field; one shared draw for every field row), parser (text rules;
# its own draw), floor (k = 1, the count is a lower bound), none (no k is applied; D-078 §4). A field row with
# `prior: true` takes the prior below; a parser row with no value has no hand check yet and keeps k = 1.
adu_flag_undercount:
  table: true
  unit: ratio of true ADU permits to counted ADU permits (k >= 1)
  source: "D-078 (Ben, 2026-11-10: accepted all six proposals), from D-074 step 1 and D-075 step 2"
  prior:
    low: 1.0
    interval: 0.90
    source: "D-078 §1: lognormal, centre exp(mean ln k) of the measured field-flag rows (Raleigh, Austin, Portland: 1.086), 90% range from 1.0 to the largest measured central upper bound (Raleigh 1.21); recomputed from the table, so a new measured field row moves it"
  rows:
    # -- field flags, measured on two parcel rolls --
    - source: raleigh_permits
      place: Raleigh (NC)
      kind: field
      value: 1.07
      low: 1.02
      high: 1.21
      interval: 0.90
      report: reports/nc/wake-roll-adu-diff.md
      notes: "D-074 deviation: |P∩R| 30, |a| 2 with the 4 duplex rebuilds left out. As written 1.20 (1.10-1.41); upper sensitivity 1.4 (1.2-1.7)"
    - source: austin_permits
      place: Austin (TX)
      kind: field
      value: 1.13
      low: 1.09
      high: 1.18
      interval: 0.90
      report: reports/tx/adu-coverage-and-undercount.md
      notes: "k = (242 + 31) / 242, R-102 Secondary Apartment flags against the TCAD rolls"
    - source: portland_permits
      place: Portland (OR)
      kind: field
      value: 1.06
      low: 1.05
      high: 1.07
      interval: 0.90
      report: reports/or/adu-coverage-and-undercount.md
      notes: "IS_ADU flag against the RLIS rolls; as written 1.07 (1.06-1.08)"
    # -- field flags with no measured k: the prior (D-078 §1) --
    - source: durham_permits
      place: Durham city and county (NC)
      kind: field
      prior: true
      report: src/lotline/adapters/states/nc/durham_permits.py
      notes: "'Accessory Dwelling' permit type, a field flag (D-074 step 1); no second roll to measure k"
    - source: asheville_permits
      place: Asheville (NC), 2022 on
      kind: field
      first_year: 2022
      prior: true
      report: reports/nc/asheville-adu-scout.md
      notes: "City-typed ADU Detached / ADU Attached record types from 2022"
    - source: bend_permits
      place: Bend (OR)
      kind: field
      prior: true
      report: src/lotline/adapters/states/or/bend_permits.py
      notes: "BldgUse = ADU, the city's own code"
    - source: medford_permits
      place: Medford (OR)
      kind: field
      prior: true
      report: src/lotline/adapters/states/or/medford_permits.py
      notes: "PermitSubType ADU (and the reduced-SDC ADU subtypes)"
    - source: mwvcog_permits
      place: Mid-Willamette Valley COG members (OR)
      kind: field
      prior: true
      report: src/lotline/adapters/states/or/mwvcog_permits.py
      notes: "Type code ADU"
    - source: cstx_permits
      place: College Station (TX)
      kind: field
      prior: true
      report: src/lotline/adapters/states/tx/cstx_permits.py
      notes: "Residential Accessory 'Living Quarters' subtype"
    - source: sa_permits
      place: San Antonio (TX)
      kind: field
      prior: true
      report: src/lotline/adapters/states/tx/sa_permits.py
      notes: "'Res Accessory Dwelling Permit' type; the parser adds a few from accessory-building descriptions, but the city's type carries the count"
    # -- parser sources: k = 1 / recall from each source's own check (D-078 §2-3) --
    - source: mpls_ccs_permits
      place: Minneapolis (MN)
      kind: parser
      value: 1.04
      low: 1.02
      high: 1.10
      interval: 0.90
      report: reports/mn/adu-coverage-and-undercount.md
      notes: "Measured on the 2019/2023 Minneapolis rolls with duplexes removed (|P∩R| 94, |a| 4); as written 1.06 (1.03-1.12)"
    - source: meck_permits
      place: Charlotte and the Mecklenburg towns (NC)
      kind: parser
      value: 1.04
      low: 1.0
      high: 1.27
      interval: 0.90
      report: reports/nc/charlotte-adu-counts.md
      notes: "Charlotte's hand check: central recall 0.96 (1.04); strict precision 0.79 (1.27) taken as the upper end; worst case 0.70 (1.43) kept as a sensitivity. The towns share the file and the parser, so they take Charlotte's k"
    - source: cle_permits
      place: Cleveland (OH)
      kind: parser
      value: 1.07
      low: 1.0
      high: 1.07
      interval: 0.90
      report: reports/oh/adu-coverage-and-undercount.md
      notes: "Hand check: recall at least 15/16 among near-miss permits, k about 1.0-1.07 (D-078); central at 1 / (15/16)"
    - source: asheville_permits
      place: Asheville (NC), before 2022
      kind: parser
      last_year: 2021
      value: 1.59
      low: 1.43
      high: 1.79
      interval: 0.90
      low_recall: true
      report: reports/nc/asheville-adu-scout.md
      notes: "Description rule recall 82/130 = 0.63 on the city-typed 2022-26 ADUs; range from the 90% Wilson interval on that share (0.56-0.70). Low-recall row: reported with and without it (D-078 §3)"
    - source: austin_inferred_adu
      place: Austin (TX), inferred-ADU rule, 2024 on
      kind: parser
      first_year: 2024
      value: 2.30
      low: 1.89
      high: 2.94
      interval: 0.95
      low_recall: true
      report: reports/tx/adu-coverage-and-undercount.md
      notes: "Recall 0.434 (95%: 0.34-0.53) of the post-HOME inferred rule. Keyed to the inferred rule's own source name: its counts are not yet in the permits table, and austin_permits' R-102 flags keep the field k. Low-recall row (D-078 §3)"
    # parser sources with no hand-check k yet: k = 1 (their counts stay lower bounds)
    - {source: greensboro_permits, place: Greensboro (NC), kind: parser, report: src/lotline/adapters/states/nc/greensboro_permits.py, notes: "No measured recall in D-078"}
    - {source: wilmington_permits, place: Wilmington (NC), kind: parser, report: reports/nc/wilmington-adu-scout.md, notes: "No measured recall in D-078"}
    - {source: chapel_hill_permits, place: Chapel Hill (NC), kind: parser, report: reports/nc/chapel-hill-adu-scout.md, notes: "No measured recall in D-078"}
    - {source: cary_permits, place: Cary (NC), kind: parser, report: reports/nc/cary-adu-scout.md, notes: "Most ADUs named only in the description; D-074 lets the Wake-roll match set Cary's k later"}
    - {source: rochester_permits, place: Rochester (MN), kind: parser, report: src/lotline/adapters/states/mn/rochester_permits.py, notes: "No measured recall in D-078"}
    - {source: cincy_permits, place: Cincinnati (OH), kind: parser, report: src/lotline/adapters/states/oh/cincy_permits.py, notes: "No measured recall in D-078"}
    - {source: montgomery_permits, place: Dayton and Montgomery County (OH), kind: parser, report: src/lotline/adapters/states/oh/montgomery_permits.py, notes: "No measured recall in D-078"}
    - {source: dallas_permits, place: Dallas (TX), kind: parser, report: src/lotline/adapters/states/tx/dallas_permits.py, notes: "No measured recall in D-078"}
    - {source: fw_permits, place: Fort Worth (TX), kind: parser, report: src/lotline/adapters/states/tx/fw_permits.py, notes: "No measured recall in D-078"}
    # -- floor and no-k sources --
    - source: metc_residential_permits
      place: Met Council suburbs (MN)
      kind: floor
      report: reports/mn/adu-coverage-and-undercount.md
      notes: "Ben, 2026-11-10: the suburbs' counts are a floor; k = 1 (D-078 §6)"
    - source: columbus_permits
      place: Columbus (OH)
      kind: none
      report: reports/oh/adu-coverage-and-undercount.md
      notes: "D-078 §4: the panel keeps the larger of flagged permits and Council variances each year; the variance ratio (about 3.9) is not applied on top"
    - source: columbus_legistar
      place: Columbus (OH), Council variances
      kind: none
      report: reports/oh/adu-coverage-and-undercount.md
      notes: "D-078 §4, as columbus_permits"
    - source: franklin_auditor
      place: Franklin County Auditor permit file (OH)
      kind: none
      report: reports/oh/adu-coverage-and-undercount.md
      notes: "Columbus's ADU flags come from this file (D-078 §4: no k). Other Franklin County places in it also take no k until a check measures one"
