[project]
name = "lotline"
description = "Transparent simulator of how state housing reforms change housing production over five years"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "httpx>=0.28,<1",
    "matplotlib>=3.11.2",
    "numpy>=2,<3",
    "openpyxl>=3.1.5",
    "pandas>=3.0,<4",
    "pandera>=0.36,<1",
    "pyarrow>=26",
    "pydantic>=2,<3",
    "pypdf>=7.1.0",
    "pyyaml>=6",
    "xlrd>=2.0.2",
]

[project.scripts]
lotline = "lotline.cli:main"

[dependency-groups]
dev = [
    "pip-licenses",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
]

# The uv that wrote uv.lock; CI's setup-uv reads this too, so lock-format changes in a later uv can't surprise a run.
[tool.uv]
required-version = ">=0.13.5,<0.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lotline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lotline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: a long simulation-recovery test (tests/slow_tests.txt); skip with -m \"not slow\""]
# A pattern pandas 4 will reject fails now, not on the day pandas 4 lands.
filterwarnings = ["error::pandas.errors.Pandas4Warning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["compliance_check.py", "scripts/dev/create_issues.py"]  # standalone stdlib scripts

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/lotline/schemas.py" = ["UP045"]  # pandera reads Optional[...] to mark columns a source may omit
