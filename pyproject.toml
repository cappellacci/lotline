[project]
name = "lotline"
description = "Transparent simulator of how state housing reforms change housing production over five years"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "duckdb",
    "httpx",
    "pandas>=2",
    "pandera",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
lotline = "lotline.cli:main"

[dependency-groups]
dev = [
    "pip-licenses",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lotline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lotline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["compliance_check.py", "scripts/dev/create_issues.py"]  # standalone stdlib scripts

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/lotline/schemas.py" = ["UP045"]  # pandera reads Optional[...] to mark columns a source may omit
