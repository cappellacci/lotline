# Runs the Lotline challenge compliance check on every push and PR.
# GitHub-settings checks (--github) run only when a token with security read access is available.
name: compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COMPLIANCE_TOKEN }}   # fine-grained PAT with repo security read access (optional)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --run executes commands.setup from challenge.toml, so project deps get installed
      # into this runner's Python before the license scan below.
      - name: Static + run checks
        run: python compliance_check.py --run
      - name: Dependency licenses
        run: |
          pip install pip-licenses
          python compliance_check.py --deps
      - name: GitHub security settings
        if: ${{ env.GH_TOKEN != '' }}
        run: python compliance_check.py --github
