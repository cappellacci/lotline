# Runs the Lotline challenge compliance check on every push and PR.
# GitHub-settings checks (--github) run only when a token with security read access is available.
name: compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COMPLIANCE_TOKEN }}   # fine-grained PAT with repo security read access (optional)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # The setup command (commands.setup in challenge.toml) runs here; the test suite runs once, in tests.yml
      # (both workflows are required checks), instead of a second 20-minute run here (nightly review, 2026-11-25).
      - name: Setup (commands.setup)
        run: uv sync --frozen
      - name: Static checks
        run: python compliance_check.py
      # Run inside the project venv so pip-licenses sees the project's dependencies.
      - name: Dependency licenses
        run: uv run python compliance_check.py --deps
      - name: GitHub security settings
        if: ${{ env.GH_TOKEN != '' }}
        run: python compliance_check.py --github
