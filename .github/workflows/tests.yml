name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.13.5"  # CI uses the uv that wrote uv.lock; users may run any newer uv
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7; the app tests run the page's JavaScript under node
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/dev/params_table.py --check
      - run: uv run pytest -q -n auto  # every test, spread over the runner's cores (pytest-xdist)
